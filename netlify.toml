[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/assistant"
  to = "/.netlify/functions/assistant"
  status = 200

[[redirects]]
  from = "/shop"
  to = "/shop.html"
  status = 200

[[redirects]]
  from = "/build"
  to = "/build.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/cart"
  to = "/cart.html"
  status = 200

[[redirects]]
  from = "/product"
  to = "/product.html"
  status = 200

[[redirects]]
  from = "/policies"
  to = "/policies.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
